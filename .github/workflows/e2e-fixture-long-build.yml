name: E2E Fixture (Long Build)

on:
  workflow_dispatch:

jobs:
  upterm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start upterm session (detached)
        uses: ./detached
        with:
          wait-timeout-minutes: 1

      - name: Build longer than the countdown
        run: |
          echo "BUILD_STARTED"
          sleep 90
          echo "BUILD_FINISHED"
