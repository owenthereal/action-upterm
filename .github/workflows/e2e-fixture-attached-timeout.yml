name: E2E Fixture (Attached Timeout)

on:
  workflow_dispatch:

jobs:
  upterm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start upterm session
        uses: ./
        with:
          wait-timeout-minutes: 1

      - name: After the session
        run: echo "ATTACHED_STEP_FINISHED"
