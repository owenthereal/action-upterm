name: "Debug with ssh"
description: "This GitHub Action enables direct interaction with the host system running your GitHub Actions via SSH"
author: "Owen Ou"
branding:
  icon: "terminal"
  color: "purple"
runs:
  using: "node24"
  main: "../lib/index.js"
  post: "../lib/index.js"
  post-if: "!cancelled()"
inputs:
  limit-access-to-actor:
    description: "If only the public SSH keys of the user triggering the workflow (and, on a re-run, of whoever re-ran it) should be authorized. Bot accounts such as dependabot[bot] have no SSH keys and are skipped; if that leaves no one to authorize, no session is started"
    required: false
    default: "false"
  limit-access-to-users:
    description: "If only the public SSH keys of the listed GitHub users should be authorized"
    required: false
    default: ""
  upterm-server:
    description: "upterm server address (required), supported protocols are ssh, ws, or wss."
    required: true
    default: "ssh://uptermd.upterm.dev:22"
  known-hosts:
    description: "known_hosts entry for the upterm server, pinning its host key. Required when upterm-server is not the default. The default server's key is bundled with the action. A relay that presents a host certificate needs an '@cert-authority <host> <type> <key>' line."
    required: false
    default: ""
  wait-timeout-minutes:
    description: "Integer number of minutes to wait for a guest to join before upterm ends the session. Attached mode: unset or 0 means no timeout. Detached mode: counted from when all regular steps finish; unset or 0 means 10. Once a guest has joined, the session stays up until it ends."
    required: false
    default: ""
  upterm-version:
    description: "Upterm version/tag to install (e.g., v0.32.0). Requires v0.32.0 or newer. Defaults to latest when unset."
    required: false
  detached:
    description: "In detached mode, the workflow job will continue while the upterm session is active"
    required: false
    default: "true"
outputs:
  ssh-command:
    description: "The SSH command to connect to the upterm session (e.g., 'ssh session:token@uptermd.upterm.dev')"
